<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数值</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
<style>
  .stat-card {
    max-width: 440px;
    margin: 10px auto;
    background: #09080e;
    border-radius: 18px;
    border: 1px solid rgba(139, 92, 246, 0.25);
    box-shadow: 0 14px 36px -8px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(139, 92, 246, 0.15);
    overflow: hidden;
  }
  .stat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(139, 92, 246, 0.08);
    border-bottom: 1px solid rgba(139, 92, 246, 0.15);
    font-size: 11.5px;
    font-weight: 600;
    color: #c4b5fd;
    letter-spacing: 0.05em;
  }
  .stat-list {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .stat-label {
    color: #d1ccd9;
    font-weight: 500;
  }
  .stat-val-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
  }
  .stat-flow {
    color: #8e889e;
  }
  .stat-delta {
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10.5px;
  }
  .stat-delta.up {
    color: #10b981;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .stat-delta.down {
    color: #f43f5e;
    background: rgba(244, 63, 94, 0.12);
    border: 1px solid rgba(244, 63, 94, 0.25);
  }
</style>
</head>
<body>
<div class="stat-card">
  <div class="stat-header">
    <span>⚡</span>
    <span>机主生物神经与实时数据变动</span>
  </div>
  <div class="stat-list" id="list"></div>
</div>
<script>
const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  let myIndex = 0;
  try {
    const fe = window.frameElement;
    if (fe) {
      const parent = fe.closest ? fe.closest('.mes_text') : fe.parentElement;
      if (parent) {
        const iframes = Array.from(parent.querySelectorAll('iframe'));
        const same = iframes.filter(f => f === fe || f.src === fe.src);
        const found = same.indexOf(fe);
        if (found >= 0) myIndex = found;
      }
    }
  } catch (e) {}
  const allMatches = Array.from(原文.matchAll(new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>', 'g')));
  const m = allMatches[myIndex] || allMatches[0];
  return m ? m[1].trim() : '';
};

const raw = 取('数值');
const list = document.getElementById('list');

for (const 一 of raw.split('\n')) {
  const s = 一.trim();
  if (!s) continue;
  const row = document.createElement('div');
  row.className = 'stat-row';
  
  const clean = s.replace(/^[●•·\s]+/, '');
  const deltaMatch = clean.match(/([▲▼][\d.%]+(?:\([^)]*\))?)/);
  const delta = deltaMatch ? deltaMatch[1] : '';
  const mainPart = clean.replace(/([▲▼][\d.%]+(?:\([^)]*\))?)/, '').trim();
  
  const labelDiv = document.createElement('span');
  labelDiv.className = 'stat-label';
  labelDiv.textContent = mainPart;
  row.appendChild(labelDiv);
  
  if (delta) {
    const dSpan = document.createElement('span');
    const isUp = delta.startsWith('▲');
    dSpan.className = 'stat-delta ' + (isUp ? 'up' : 'down');
    dSpan.textContent = delta;
    row.appendChild(dSpan);
  }
  list.appendChild(row);
}
</script>
</body>
</html>
