<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数值</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
</head>
<body style="--hue:265">
<div class="dsh-card" id="box">
  <div class="dsh-hd">
    <div class="dsh-hd-ico">📊</div>
    <div class="dsh-hd-t">数值变化</div>
    <div class="dsh-hd-sub" id="t">—</div>
  </div>
  <div class="dsh-bd p0" id="list"></div>
</div>
<script>

const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  const re = new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
// ★★★ 属性解析 —— 只用字符串操作，不用正则
//   ★ 为什么：这里有 Python→文件→浏览器 三层转义，
//     正则字面量里的 \s 会在某一层被吃掉或加倍，极难排查
//   ★★ 改用 indexOf/slice 之后，没有任何转义问题
const 拆属性 = (串) => {
  const 出 = {};
  let i = 0;
  while (i < 串.length) {
    const 等 = 串.indexOf('=', i);
    if (等 < 0) break;
    const 键 = 串.slice(i, 等).trim().replace(/^["'\s]+/, '');
    let 起 = 等 + 1;
    while (起 < 串.length && 串[起] === ' ') 起++;
    let 值 = '';
    if (串[起] === '"' || 串[起] === "'") {
      const 引 = 串[起];
      const 闭 = 串.indexOf(引, 起 + 1);
      值 = 串.slice(起 + 1, 闭 < 0 ? 串.length : 闭);
      i = (闭 < 0 ? 串.length : 闭) + 1;
    } else {
      const 空 = 串.indexOf(' ', 起);
      值 = 串.slice(起, 空 < 0 ? 串.length : 空);
      i = 空 < 0 ? 串.length : 空 + 1;
    }
    if (键) 出[键] = 值;
  }
  return 出;
};

const 属性 = (名) => {
  const i = 原文.indexOf('<' + 名);
  if (i < 0) return '';
  const j = 原文.indexOf('>', i);
  if (j < 0) return '';
  return 原文.slice(i + 名.length + 1, j).trim();
};

// ★ 取属性的【值】—— 不是整串
//   ★ 踩过：原来 属性('聊天') 返回 `平台="微信"`，标题就显示这个
//   ★★ 现在 取值('聊天') 返回 `微信`
const 取值 = (名, key) => {
  const 串 = 属性(名);
  if (!串) return '';
  if (key) return 拆属性(串)[key] || '';
  const 全 = 拆属性(串);
  const 键 = Object.keys(全);
  return 键.length ? 全[键[0]] : 串;
};

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const raw = 取('数值');
const list = document.getElementById('list');
const 行 = raw.split('\n').map(x => x.trim()).filter(Boolean);
let n = 0;
for (const 一 of 行) {
  // 形式：● 兴奋 45 → 58 ▲13   或   ● 现金 20000 → 19970 ▼30（打车）
  const m = 一.match(/^[●•*]?\s*([^0-9\-+▲▼]+?)\s*([\d.,]+)\s*(?:→|->)\s*([\d.,]+)\s*([▲▼+\-])\s*([\d.,]+)\s*(.*)$/);
  if (!m) {
    // 纯文字行 → 当说明
    if (一.length > 1) {
      const d = document.createElement('div');
      d.className = 'dsh-key';
      d.textContent = 一.replace(/^[●•*]\s*/, '');
      list.appendChild(d);
    }
    continue;
  }
  const [, 名, 旧, 新, 号, 差, 注] = m;
  const 上 = (号 === '▲' || 号 === '+');
  const 色 = /现金|钱|¥/.test(名) ? 'money' : /经验|阅历/.test(名) ? 'exp' : '';
  const d = document.createElement('div');
  d.className = 'dsh-delta';
  d.innerHTML = `<span class="dsh-delta-k">${转义(名.trim())}</span>
    <span class="dsh-delta-v">${转义(旧)} → ${转义(新)}</span>
    <span class="dsh-delta-a ${上 ? 'up' : 'down'}">${上 ? '▲' : '▼'}${转义(差)}</span>` +
    (注 ? `<span class="dsh-mono" style="margin-left:6px">${转义(注)}</span>` : '');
  list.appendChild(d);
  n++;
}
document.getElementById('t').textContent = n + ' 项';
if (!list.children.length) document.getElementById('box').style.display = 'none';

</script>
</body>
</html>
