<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数值</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
<style>
  .stat-card {
    max-width: 440px;
    margin: 10px auto;
    background: #09080e;
    border-radius: 18px;
    border: 1px solid rgba(139, 92, 246, 0.25);
    box-shadow: 0 14px 36px -8px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(139, 92, 246, 0.15);
    overflow: hidden;
  }
  .stat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(139, 92, 246, 0.08);
    border-bottom: 1px solid rgba(139, 92, 246, 0.15);
    font-size: 11.5px;
    font-weight: 600;
    color: #c4b5fd;
    letter-spacing: 0.05em;
  }
  .stat-list {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .stat-label {
    color: #d1ccd9;
    font-weight: 500;
  }
  .stat-val-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
  }
  .stat-flow {
    color: #8e889e;
  }
  .stat-delta {
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10.5px;
  }
  .stat-delta.up {
    color: #10b981;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .stat-delta.down {
    color: #f43f5e;
    background: rgba(244, 63, 94, 0.12);
    border: 1px solid rgba(244, 63, 94, 0.25);
  }
</style>
</head>
<body>
<div class="stat-card">
  <div class="stat-header">
    <span>⚡</span>
    <span>机主生物神经与实时数据变动</span>
  </div>
  <div class="stat-list" id="list"></div>
</div>
<script>
const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  // ★★★ 我是这一楼里第几个标签？—— 用酒馆助手给的序号，不再靠猜
  //   ★ 为什么不能数 f.src：酒馆助手 use_blob_url 默认 false，
  //     每个 iframe 的 src 都是 about:srcdoc → 分不清谁是谁 → 同一楼里混排会错位
  //   ★ 序号来源：iframe.id = "TH-message--<楼层>--<代码块序号>"（酒馆助手源码定的）
  let 块序 = -1;
  try {
    const fe0 = window.frameElement;
    const id = (fe0 && fe0.id) || window.__TH_IFRAME_ID || window.name || '';
    const mt = /TH-message--\d+--(\d+)/.exec(id);
    if (mt) 块序 = Number(mt[1]);
  } catch (e) {}
  if (块序 < 0) {
    // ★ 兜底：数我在本楼层全部 iframe 里的位置，就是代码块序号
    try {
      const fe1 = window.frameElement;
      const box = fe1 && (fe1.closest ? fe1.closest('.mes_text') : fe1.parentElement);
      if (box) 块序 = Array.prototype.indexOf.call(box.querySelectorAll('iframe'), fe1);
    } catch (e) {}
  }
  const 全部 = Array.from(原文.matchAll(/<([A-Za-z\u4e00-\u9fa5_]+)(?:\s[^>]*)?>([\s\S]*?)<\/\1>/g));
  // ★ 校验：序号指向的那一块，标签名就是我
  //   ★★ 对不上就退化成「同标签取第一个」—— 只退化成旧行为，绝不显示别人的内容
  if (块序 >= 0 && 全部[块序] && 全部[块序][1] === 名) return 全部[块序][2].trim();
  const 同 = 全部.filter(function (x) { return x[1] === 名; });
  return 同.length ? 同[0][2].trim() : '';
};
;

const raw = 取('数值');
const list = document.getElementById('list');

for (const 一 of raw.split('\n')) {
  const s = 一.trim();
  if (!s) continue;
  const row = document.createElement('div');
  row.className = 'stat-row';
  
  const clean = s.replace(/^[●•·\s]+/, '');
  const deltaMatch = clean.match(/([▲▼][\d.%]+(?:\([^)]*\))?)/);
  const delta = deltaMatch ? deltaMatch[1] : '';
  const mainPart = clean.replace(/([▲▼][\d.%]+(?:\([^)]*\))?)/, '').trim();
  
  const labelDiv = document.createElement('span');
  labelDiv.className = 'stat-label';
  labelDiv.textContent = mainPart;
  row.appendChild(labelDiv);
  
  if (delta) {
    const dSpan = document.createElement('span');
    const isUp = delta.startsWith('▲');
    dSpan.className = 'stat-delta ' + (isUp ? 'up' : 'down');
    dSpan.textContent = delta;
    row.appendChild(dSpan);
  }
  list.appendChild(row);
}
</script>
</body>
</html>
