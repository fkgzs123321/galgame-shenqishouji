<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>判定裁决</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: transparent !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 6px 4px;
    color: #e2e8f0;
  }
  .judge-card {
    max-width: 520px;
    margin: 4px auto;
    background: rgba(18, 20, 28, 0.9);
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(0, 229, 255, 0.1);
    backdrop-filter: blur(12px);
    overflow: hidden;
  }
  .judge-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(0, 229, 255, 0.08);
    border-bottom: 1px solid rgba(0, 229, 255, 0.18);
  }
  .judge-title {
    font-size: 12px;
    font-weight: 700;
    color: #00e5ff;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.5px;
  }
  .judge-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    background: rgba(0, 229, 255, 0.2);
    border: 1px solid rgba(0, 229, 255, 0.4);
    color: #00e5ff;
    font-weight: 600;
  }
  .judge-body {
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.6;
    color: #cbd5e1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .judge-kv {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    background: rgba(255, 255, 255, 0.03);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .judge-k {
    color: #94a3b8;
    font-weight: 500;
    white-space: nowrap;
    min-width: 45px;
  }
  .judge-v {
    color: #f1f5f9;
    flex: 1;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="judge-card" id="judge-box">
  <div class="judge-head">
    <div class="judge-title">
      <span>⚡</span>
      <span>神奇手机 · 判定裁决</span>
    </div>
    <div class="judge-badge" id="badge-type">识破</div>
  </div>
  <div class="judge-body" id="body-content">
    正在解析判定结果…
  </div>
</div>
<script>
(function() {
  function syncHeight() {
    try {
      var fe = window.frameElement;
      if (!fe) return;
      var d = document.documentElement;
      var b = document.body;
      var h = Math.max(d ? d.scrollHeight : 0, b ? b.scrollHeight : 0);
      if (h > 0) {
        fe.style.height = h + 'px';
        fe.style.minHeight = h + 'px';
      }
    } catch (_) {}
  }

  try {
    var raw = window.frameElement ? window.frameElement.getAttribute('data-raw') : '';
    // 解析属性
    var typeMatch = raw.match(/类型="([^"]+)"/);
    if (typeMatch) {
      document.getElementById('badge-type').textContent = typeMatch[1];
    }
    
    var body = document.getElementById('body-content');
    body.innerHTML = '';
    
    // 匹配键值对: key="value"
    var attrRegex = /([a-zA-Z0-9_一-龥]+)="([^"]*)"/g;
    var m;
    var count = 0;
    while ((m = attrRegex.exec(raw)) !== null) {
      if (m[1] === '类型') continue;
      count++;
      var row = document.createElement('div');
      row.className = 'judge-kv';
      row.innerHTML = '<span class="judge-k">' + m[1] + ':</span><span class="judge-v">' + (m[2] || '无') + '</span>';
      body.appendChild(row);
    }
    if (count === 0) {
      body.textContent = raw.replace(/<\/?结果[^>]*>/g, '').trim() || '判定执行完成';
    }
  } catch (e) {
    document.getElementById('body-content').textContent = String(e);
  }
  syncHeight();
  [100, 300, 800].forEach(function(t) { setTimeout(syncHeight, t); });
})();
</script>
</body>
</html>
