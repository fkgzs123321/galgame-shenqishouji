<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>照片</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
<style>
  .photo-card {
    max-width: 440px;
    margin: 12px auto;
    background: #0d0a11;
    border-radius: 20px;
    border: 1px solid rgba(244, 63, 94, 0.25);
    box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(244, 63, 94, 0.15);
    overflow: hidden;
  }
  .photo-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(244, 63, 94, 0.08);
    border-bottom: 1px solid rgba(244, 63, 94, 0.15);
  }
  .photo-icon {
    font-size: 13px;
  }
  .photo-title {
    font-size: 12.5px;
    font-weight: 600;
    color: #fda4af;
    letter-spacing: 0.04em;
    flex: 1;
  }
  .photo-tag-badge {
    font-size: 10px;
    color: #10b981;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 1px 7px;
    border-radius: 999px;
  }
  .photo-content {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 11px;
    color: #8e889e;
  }
  .meta-val {
    color: #fff;
    font-weight: 500;
  }
  .detail-quote {
    position: relative;
    padding: 10px 14px;
    background: rgba(244, 63, 94, 0.05);
    border-left: 2px solid #f43f5e;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.8;
    color: #fce7f3;
  }
  .photo-caption {
    background: rgba(0, 0, 0, 0.4);
    border: 1px dashed rgba(244, 63, 94, 0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    color: #fb7185;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="photo-card">
  <div class="photo-header">
    <span class="photo-icon">📸</span>
    <span class="photo-title">密聊实时抓拍 (已解密)</span>
    <span class="photo-tag-badge">● 真人实时在场</span>
  </div>
  <div class="photo-content" id="c"></div>
</div>
<script>
const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  let myIndex = 0;
  try {
    const fe = window.frameElement;
    if (fe) {
      const parent = fe.closest ? fe.closest('.mes_text') : fe.parentElement;
      if (parent) {
        const iframes = Array.from(parent.querySelectorAll('iframe'));
        const same = iframes.filter(f => f === fe || f.src === fe.src);
        const found = same.indexOf(fe);
        if (found >= 0) myIndex = found;
      }
    }
  } catch (e) {}
  const allMatches = Array.from(原文.matchAll(new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>', 'g')));
  const m = allMatches[myIndex] || allMatches[0];
  return m ? m[1].trim() : '';
};

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const raw = 取('照片');
const c = document.getElementById('c');
const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);

let details = [];
let metas = [];
let caption = '';

for (const l of lines) {
  if (l.startsWith('配文：') || l.startsWith('「')) {
    caption = l;
  } else if (l.includes('：') && (l.startsWith('距离') || l.startsWith('目标') || l.startsWith('状态') || l.startsWith('对象'))) {
    metas.push(l);
  } else if (!l.startsWith('📸')) {
    details.push(l);
  }
}

if (metas.length) {
  const g = document.createElement('div');
  g.className = 'meta-grid';
  for (const m of metas) {
    const p = m.split('：');
    const row = document.createElement('div');
    row.innerHTML = `<span>${转义(p[0])}：</span><span class="meta-val">${转义(p.slice(1).join('：'))}</span>`;
    g.appendChild(row);
  }
  c.appendChild(g);
}

if (details.length) {
  const q = document.createElement('div');
  q.className = 'detail-quote';
  q.innerHTML = details.map(d => 转义(d)).join('<br>');
  c.appendChild(q);
}

if (caption) {
  const cap = document.createElement('div');
  cap.className = 'photo-caption';
  cap.innerHTML = '💬 ' + 转义(caption);
  c.appendChild(cap);
}
</script>
</body>
</html>
