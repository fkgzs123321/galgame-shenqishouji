<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
</head>
<body style="--hue:190">
<div class="dsh-card" style="--hue:190">
  <div class="dsh-hd">
    <div class="dsh-hd-ico">🎤</div>
    <div class="dsh-hd-t" id="t">语音</div>
    <div class="dsh-hd-sub" id="s"></div>
  </div>
  <div class="dsh-bd">
    <div id="波" style="display:flex;align-items:center;gap:3px;height:26px;margin-bottom:11px"></div>
    <div id="c" style="color:var(--t-1);font-family:'Noto Serif SC',serif;line-height:2"></div>
  </div>
</div>
<script>

const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  const re = new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
// ★★★ 属性解析 —— 只用字符串操作，不用正则
//   ★ 为什么：这里有 Python→文件→浏览器 三层转义，
//     正则字面量里的 \s 会在某一层被吃掉或加倍，极难排查
//   ★★ 改用 indexOf/slice 之后，没有任何转义问题
const 拆属性 = (串) => {
  const 出 = {};
  let i = 0;
  while (i < 串.length) {
    const 等 = 串.indexOf('=', i);
    if (等 < 0) break;
    const 键 = 串.slice(i, 等).trim().replace(/^["'\s]+/, '');
    let 起 = 等 + 1;
    while (起 < 串.length && 串[起] === ' ') 起++;
    let 值 = '';
    if (串[起] === '"' || 串[起] === "'") {
      const 引 = 串[起];
      const 闭 = 串.indexOf(引, 起 + 1);
      值 = 串.slice(起 + 1, 闭 < 0 ? 串.length : 闭);
      i = (闭 < 0 ? 串.length : 闭) + 1;
    } else {
      const 空 = 串.indexOf(' ', 起);
      值 = 串.slice(起, 空 < 0 ? 串.length : 空);
      i = 空 < 0 ? 串.length : 空 + 1;
    }
    if (键) 出[键] = 值;
  }
  return 出;
};

const 属性 = (名) => {
  const i = 原文.indexOf('<' + 名);
  if (i < 0) return '';
  const j = 原文.indexOf('>', i);
  if (j < 0) return '';
  return 原文.slice(i + 名.length + 1, j).trim();
};

// ★ 取属性的【值】—— 不是整串
//   ★ 踩过：原来 属性('聊天') 返回 `平台="微信"`，标题就显示这个
//   ★★ 现在 取值('聊天') 返回 `微信`
const 取值 = (名, key) => {
  const 串 = 属性(名);
  if (!串) return '';
  if (key) return 拆属性(串)[key] || '';
  const 全 = 拆属性(串);
  const 键 = Object.keys(全);
  return 键.length ? 全[键[0]] : 串;
};

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('t').textContent = '语音 ' + (取值('语音') || '');
const raw = 取('语音');
const c = document.getElementById('c'), 波 = document.getElementById('波');
// ★ 声波条 —— 随机高度，看起来像真的
for (let i = 0; i < 32; i++) {
  const h = 5 + Math.abs(Math.sin(i * 1.7)) * 19;
  const d = document.createElement('span');
  d.style.cssText = `width:2px;height:${h}px;border-radius:2px;
    background:linear-gradient(180deg,hsl(190,70%,68%),hsl(190,60%,42%));opacity:${.45 + (h / 24) * .55}`;
  波.appendChild(d);
}
for (const 一 of raw.split('\n')) {
  const s = 一.trim();
  if (!s) continue;
  const d = document.createElement('div');
  if (/^[「『"“]/.test(s)) { d.className = 'dsh-quote'; }
  else { d.style.cssText = 'color:var(--t-3);font-size:12.5px;font-family:\'Noto Sans SC\''; }
  d.textContent = s;
  c.appendChild(d);
}
document.getElementById('s').textContent = '未播放';

</script>
</body>
</html>
