<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暗网</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
</head>
<body style="--hue:140">
<div class="dsh-card" style="--hue:140">
  <div class="dsh-hd">
    <div class="dsh-hd-ico" style="font-family:'JetBrains Mono',monospace">&gt;_</div>
    <div class="dsh-hd-t" id="t" style="font-family:'JetBrains Mono',monospace">dark</div>
    <div class="dsh-hd-sub" id="n">.</div>
  </div>
  <div class="dsh-bd" id="l" style="font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.85"></div>
</div>
<script>

const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  const re = new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
// ★★★ 属性解析 —— 只用字符串操作，不用正则
//   ★ 为什么：这里有 Python→文件→浏览器 三层转义，
//     正则字面量里的 \s 会在某一层被吃掉或加倍，极难排查
//   ★★ 改用 indexOf/slice 之后，没有任何转义问题
const 拆属性 = (串) => {
  const 出 = {};
  let i = 0;
  while (i < 串.length) {
    const 等 = 串.indexOf('=', i);
    if (等 < 0) break;
    const 键 = 串.slice(i, 等).trim().replace(/^["'\s]+/, '');
    let 起 = 等 + 1;
    while (起 < 串.length && 串[起] === ' ') 起++;
    let 值 = '';
    if (串[起] === '"' || 串[起] === "'") {
      const 引 = 串[起];
      const 闭 = 串.indexOf(引, 起 + 1);
      值 = 串.slice(起 + 1, 闭 < 0 ? 串.length : 闭);
      i = (闭 < 0 ? 串.length : 闭) + 1;
    } else {
      const 空 = 串.indexOf(' ', 起);
      值 = 串.slice(起, 空 < 0 ? 串.length : 空);
      i = 空 < 0 ? 串.length : 空 + 1;
    }
    if (键) 出[键] = 值;
  }
  return 出;
};

const 属性 = (名) => {
  const i = 原文.indexOf('<' + 名);
  if (i < 0) return '';
  const j = 原文.indexOf('>', i);
  if (j < 0) return '';
  return 原文.slice(i + 名.length + 1, j).trim();
};

// ★ 取属性的【值】—— 不是整串
//   ★ 踩过：原来 属性('聊天') 返回 `平台="微信"`，标题就显示这个
//   ★★ 现在 取值('聊天') 返回 `微信`
const 取值 = (名, key) => {
  const 串 = 属性(名);
  if (!串) return '';
  if (key) return 拆属性(串)[key] || '';
  const 全 = 拆属性(串);
  const 键 = Object.keys(全);
  return 键.length ? 全[键[0]] : 串;
};

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('t').textContent = 取值('暗网') || 'dark';
const raw = 取('暗网');
const l = document.getElementById('l');

// ★ 终端风：每行前面加 <span style="color:var(--c-good)">▸</span>
//   ★ 关键行（价格、地址、警告）高亮
const 行s = raw.split('\n').map((x) => x.trim()).filter(Boolean);
for (const s of 行s) {
  if (/^[—\-]{3,}$/.test(s)) {
    const hr = document.createElement('hr');
    hr.className = 'dsh-hr';
    l.appendChild(hr);
    continue;
  }
  const 警告 = /警告|危险|被抓|下套|骗|钓鱼|执法|LE\b/i.test(s);
  const 钱 = /[¥￥$]\s*[\d,.]+|\d+\s*(BTC|XMR|USDT|btc|xmr|usdt)/.test(s);
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;gap:7px;padding:3px 0';
  let 色 = 'var(--t-2)';
  let 标 = '▸';
  if (警告) { 色 = 'var(--c-bad)'; 标 = '⚠'; }
  else if (钱) { 色 = 'var(--c-money)'; 标 = '$'; }
  d.innerHTML = `<span style="flex:0 0 auto;color:${警告 ? 'var(--c-bad)' : 'var(--c-good)'};opacity:.8">${标}</span>
    <span style="flex:1;color:${色};word-break:break-word">${转义(s)}</span>`;
  l.appendChild(d);
}
if (!行s.length && raw) {
  l.innerHTML = `<div style="color:var(--t-3);white-space:pre-wrap">${转义(raw)}</div>`;
}
document.getElementById('n').textContent = 行s.length ? 行s.length + ' 行' : '.';

</script>
</body>
</html>
