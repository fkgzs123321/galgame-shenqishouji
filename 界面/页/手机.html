<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神奇手机</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
<style>
  .phone-frame {
    max-width: 440px;
    margin: 10px auto;
    background: #09080e;
    border-radius: 26px;
    border: 2px solid #231f32;
    box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .phone-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 18px 4px;
    background: #0d0b16;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .phone-clock {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
  }
  .dynamic-island {
    width: 76px;
    height: 12px;
    background: #000;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .sensor-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 4px #10b981;
  }
  .phone-status-right {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    color: rgba(255, 255, 255, 0.6);
  }
  .battery-pill {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 3px;
    padding: 1px 2px;
    height: 10px;
    width: 18px;
  }
  .battery-level {
    height: 100%;
    width: 85%;
    background: #10b981;
    border-radius: 1px;
  }
  .phone-body {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .phone-item {
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #d1ccd9;
  }
  .phone-item.primary {
    background: rgba(139, 92, 246, 0.08);
    border-color: rgba(139, 92, 246, 0.25);
    color: #fff;
  }
  .phone-item.radar {
    background: rgba(245, 158, 11, 0.08);
    border-color: rgba(245, 158, 11, 0.25);
    color: #fde68a;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-top-bar">
    <span class="phone-clock" id="clock">--:--</span>
    <div class="dynamic-island">
      <span class="sensor-dot"></span>
    </div>
    <div class="phone-status-right">
      <span>5G</span>
      <span class="battery-pill"><span class="battery-level"></span></span>
      <span id="bat">87%</span>
    </div>
  </div>
  <div class="phone-body" id="c"></div>
</div>
<script>
const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  let myIndex = 0;
  try {
    const fe = window.frameElement;
    if (fe) {
      const parent = fe.closest ? fe.closest('.mes_text') : fe.parentElement;
      if (parent) {
        const iframes = Array.from(parent.querySelectorAll('iframe'));
        const same = iframes.filter(f => f === fe || f.src === fe.src);
        const found = same.indexOf(fe);
        if (found >= 0) myIndex = found;
      }
    }
  } catch (e) {}
  const allMatches = Array.from(原文.matchAll(new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>', 'g')));
  const m = allMatches[myIndex] || allMatches[0];
  let res = m ? m[1].trim() : '';
  if (res.includes('<聊天')) res = res.replace(/<\/?聊天[^>]*>/g, '');
  return res;
};

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const now = new Date();
document.getElementById('clock').textContent =
  String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

const raw = 取('phone');
const c = document.getElementById('c');
const 行 = raw.split('\n');

for (const 一 of 行) {
  const s = 一.trim();
  if (!s) continue;
  const d = document.createElement('div');
  d.className = 'phone-item';
  
  if (/^📱|底层穿透|硬件/.test(s)) {
    d.className += ' primary';
    d.innerHTML = '<strong>' + 转义(s) + '</strong>';
  } else if (/^⚡|雷达|发现/.test(s)) {
    d.className += ' radar';
    d.innerHTML = '⚡ ' + 转义(s.replace(/^⚡\s*/, ''));
  } else if (/^●|已自动|越权/.test(s)) {
    d.innerHTML = '<span style="color:#a78bfa;margin-right:4px">●</span>' + 转义(s.replace(/^●\s*/, ''));
  } else {
    d.innerHTML = 转义(s);
  }
  c.appendChild(d);
}
</script>
</body>
</html>
