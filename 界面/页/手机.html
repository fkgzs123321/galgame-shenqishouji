<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机系统</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
<style>
  /* ★★★ 这里【不再画手机壳】。
   * 原因：真正的小手机在悬浮球浮窗里（界面/面板）。
   * 本页只把 <phone>…</phone> 里的系统消息渲染成【通知卡】。
   *   旧版有 .phone-frame / .dynamic-island / .battery-pill —— 那是在楼层里又画了一台手机。
   */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 6px 4px;
    color: #e2e8f0;
  }
  .sys-card {
    max-width: 480px;
    margin: 6px auto;
    background: rgba(14, 13, 22, 0.94);
    border: 1px solid rgba(139, 92, 246, 0.28);
    border-radius: 14px;
    box-shadow: 0 8px 26px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    overflow: hidden;
    backdrop-filter: blur(10px);
  }
  /* ── 顶栏：不是手机壳，是一行「系统」标识 ── */
  .sys-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    background: linear-gradient(90deg, rgba(139, 92, 246, 0.16), rgba(139, 92, 246, 0.03));
    border-bottom: 1px solid rgba(139, 92, 246, 0.18);
    font-size: 11px;
    letter-spacing: 0.4px;
    color: #c4b5fd;
  }
  .sys-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #a78bfa;
    box-shadow: 0 0 6px #a78bfa;
    flex: none;
  }
  .sys-bar-t { font-weight: 600; }
  .sys-bar-s { margin-left: auto; color: rgba(196, 181, 253, 0.45); font-size: 10px; }

  /* ── 通知条目 ── */
  .sys-body { padding: 5px 0; }
  .sys-item {
    display: flex;
    gap: 8px;
    padding: 7px 13px;
    font-size: 12.5px;
    line-height: 1.62;
    color: #cfc9db;
    border-left: 2px solid transparent;
  }
  .sys-item + .sys-item { border-top: 1px solid rgba(255, 255, 255, 0.035); }
  .sys-item .mk { flex: none; opacity: 0.85; }

  /* 穿透 / 硬件底层的头一条 —— 高亮 */
  .sys-item.primary {
    background: rgba(139, 92, 246, 0.09);
    border-left-color: #8b5cf6;
    color: #fff;
    font-weight: 600;
  }
  /* 雷达 / 检索 —— 琥珀 */
  .sys-item.radar {
    background: rgba(245, 158, 11, 0.07);
    border-left-color: #f59e0b;
    color: #fde68a;
  }
  /* 警示 / 风险 —— 红 */
  .sys-item.warn {
    background: rgba(239, 68, 68, 0.08);
    border-left-color: #ef4444;
    color: #fca5a5;
  }
  /* 身份 / 越权 —— 紫点 */
  .sys-item.ident { border-left-color: rgba(167, 139, 250, 0.5); }
</style>
</head>
<body>
<div class="sys-card">
  <div class="sys-bar">
    <span class="sys-dot"></span>
    <span class="sys-bar-t">手机 · 系统层</span>
    <span class="sys-bar-s" id="clock">--:--</span>
  </div>
  <div class="sys-body" id="c"></div>
</div>
<script>
/* ★★★ 同页多实例：按本 iframe 在宿主里的序号，取第 N 个 <phone> */
const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  // ★★★ 我是这一楼里第几个标签？—— 用酒馆助手给的序号，不再靠猜
  //   ★ 为什么不能数 f.src：酒馆助手 use_blob_url 默认 false，
  //     每个 iframe 的 src 都是 about:srcdoc → 分不清谁是谁 → 同一楼里混排会错位
  //   ★ 序号来源：iframe.id = "TH-message--<楼层>--<代码块序号>"（酒馆助手源码定的）
  let 块序 = -1;
  try {
    const fe0 = window.frameElement;
    const id = (fe0 && fe0.id) || window.__TH_IFRAME_ID || window.name || '';
    const mt = /TH-message--\d+--(\d+)/.exec(id);
    if (mt) 块序 = Number(mt[1]);
  } catch (e) {}
  if (块序 < 0) {
    // ★ 兜底：数我在本楼层全部 iframe 里的位置，就是代码块序号
    try {
      const fe1 = window.frameElement;
      const box = fe1 && (fe1.closest ? fe1.closest('.mes_text') : fe1.parentElement);
      if (box) 块序 = Array.prototype.indexOf.call(box.querySelectorAll('iframe'), fe1);
    } catch (e) {}
  }
  const 全部 = Array.from(原文.matchAll(/<([A-Za-z\u4e00-\u9fa5_]+)(?:\s[^>]*)?>([\s\S]*?)<\/\1>/g));
  // ★ 校验：序号指向的那一块，标签名就是我
  //   ★★ 对不上就退化成「同标签取第一个」—— 只退化成旧行为，绝不显示别人的内容
  if (块序 >= 0 && 全部[块序] && 全部[块序][1] === 名) return 全部[块序][2].trim();
  const 同 = 全部.filter(function (x) { return x[1] === 名; });
  return 同.length ? 同[0][2].trim() : '';
};
;

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const now = new Date();
document.getElementById('clock').textContent =
  String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

const raw = 取('phone');
const c = document.getElementById('c');

for (const 一 of raw.split('\n')) {
  const s = 一.trim();
  if (!s) continue;
  const d = document.createElement('div');
  d.className = 'sys-item';

  // ★ 分类（★ 与旧版同判据，只换渲染容器）
  if (/^📱|底层穿透|硬件|系统层/.test(s)) {
    d.className += ' primary';
    d.innerHTML = '<span class="mk">📱</span><span>' + 转义(s.replace(/^📱\s*/, '')) + '</span>';
  } else if (/^⚡|雷达|检索|发现/.test(s)) {
    d.className += ' radar';
    d.innerHTML = '<span class="mk">⚡</span><span>' + 转义(s.replace(/^⚡\s*/, '')) + '</span>';
  } else if (/^⚠|风险|警告|已记录/.test(s)) {
    d.className += ' warn';
    d.innerHTML = '<span class="mk">⚠</span><span>' + 转义(s.replace(/^⚠️?\s*/, '')) + '</span>';
  } else if (/^●|已自动|越权|伪装|接入/.test(s)) {
    d.className += ' ident';
    d.innerHTML = '<span class="mk" style="color:#a78bfa">●</span><span>' + 转义(s.replace(/^●\s*/, '')) + '</span>';
  } else {
    d.innerHTML = '<span>' + 转义(s) + '</span>';
  }
  c.appendChild(d);
}
</script>
</body>
</html>
