<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>她说</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
</head>
<body style="--hue:350">
<div class="dsh-card" style="--hue:350">
  <div class="dsh-bd" style="position:relative;padding:17px 19px 17px 40px">
    <div style="position:absolute;left:13px;top:11px;font-size:30px;color:hsl(350,60%,55%);opacity:.35;font-family:Georgia,serif">“</div>
    <div id="c" style="color:var(--t-1);font-family:'Noto Serif SC',serif;font-size:14px;line-height:2.05;font-style:italic"></div>
  </div>
</div>
<script>

const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  const re = new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
const 属性 = (名) => {
  const re = new RegExp('<' + 名 + '\\s+([^>]*)>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const raw = 取('她');
const c = document.getElementById('c');
for (const 一 of raw.split('\n')) {
  const s = 一.trim();
  if (!s) { c.insertAdjacentHTML('beforeend', '<div style="height:7px"></div>'); continue; }
  const d = document.createElement('div');
  d.textContent = s;
  c.appendChild(d);
}

</script>
</body>
</html>
