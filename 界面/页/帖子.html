<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帖子</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
</head>
<body style="--hue:15">
<div class="dsh-card" style="--hue:15">
  <div class="dsh-hd">
    <div class="dsh-hd-ico">📄</div>
    <div class="dsh-hd-t" id="t">帖子</div>
    <div class="dsh-hd-sub" id="m"></div>
  </div>
  <div class="dsh-bd" id="b"></div>
</div>
<script>

const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  const re = new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
// ★★★ 属性解析 —— 只用字符串操作，不用正则
//   ★ 为什么：这里有 Python→文件→浏览器 三层转义，
//     正则字面量里的 \s 会在某一层被吃掉或加倍，极难排查
//   ★★ 改用 indexOf/slice 之后，没有任何转义问题
const 拆属性 = (串) => {
  const 出 = {};
  let i = 0;
  while (i < 串.length) {
    const 等 = 串.indexOf('=', i);
    if (等 < 0) break;
    const 键 = 串.slice(i, 等).trim().replace(/^["'\s]+/, '');
    let 起 = 等 + 1;
    while (起 < 串.length && 串[起] === ' ') 起++;
    let 值 = '';
    if (串[起] === '"' || 串[起] === "'") {
      const 引 = 串[起];
      const 闭 = 串.indexOf(引, 起 + 1);
      值 = 串.slice(起 + 1, 闭 < 0 ? 串.length : 闭);
      i = (闭 < 0 ? 串.length : 闭) + 1;
    } else {
      const 空 = 串.indexOf(' ', 起);
      值 = 串.slice(起, 空 < 0 ? 串.length : 空);
      i = 空 < 0 ? 串.length : 空 + 1;
    }
    if (键) 出[键] = 值;
  }
  return 出;
};

const 属性 = (名) => {
  const i = 原文.indexOf('<' + 名);
  if (i < 0) return '';
  const j = 原文.indexOf('>', i);
  if (j < 0) return '';
  return 原文.slice(i + 名.length + 1, j).trim();
};

// ★ 取属性的【值】—— 不是整串
//   ★ 踩过：原来 属性('聊天') 返回 `平台="微信"`，标题就显示这个
//   ★★ 现在 取值('聊天') 返回 `微信`
const 取值 = (名, key) => {
  const 串 = 属性(名);
  if (!串) return '';
  if (key) return 拆属性(串)[key] || '';
  const 全 = 拆属性(串);
  const 键 = Object.keys(全);
  return 键.length ? 全[键[0]] : 串;
};

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const raw = 取('帖子');
const 行s = raw.split('\n').map(x => x.trim());
const b = document.getElementById('b');
let 头 = [], 正文 = [], 评论 = [], 段 = 0;
for (const 一 of 行s) {
  if (/^💬|^评论/.test(一)) { 段 = 2; continue; }
  if (/^—{2,}$/.test(一)) { 段 = 段 === 0 ? 1 : 段; continue; }
  if (!一) continue;
  (段 === 0 ? 头 : 段 === 1 ? 正文 : 评论).push(一);
}
if (头.length) {
  document.getElementById('t').textContent = 头[0].replace(/^📄\s*/, '');
  if (头[1]) document.getElementById('m').textContent = 头[1];
  b.insertAdjacentHTML('beforeend', `<div class="dsh-mono" style="margin-bottom:11px">${转义(头.slice(1).join(' · '))}</div>`);
}
// ★ 正文：她的原话用引用块
for (const p of 正文) {
  const d = document.createElement('div');
  if (/^[「『"“]/.test(p)) { d.className = 'dsh-quote'; }
  else { d.style.cssText = 'margin:9px 0;color:var(--t-2);line-height:1.95'; }
  d.innerHTML = 转义(p);
  b.appendChild(d);
}
if (评论.length) {
  b.insertAdjacentHTML('beforeend', '<hr class="dsh-hr">');
  for (const r of 评论) {
    const m = r.match(/^([^：:]+)[：:]\s*(.*)$/);
    const d = document.createElement('div');
    d.className = 'dsh-delta';
    d.style.display = 'block';
    d.innerHTML = m
      ? `<span style="color:var(--c-info);font-size:12px">${转义(m[1])}</span>
         <span style="color:var(--t-2);margin-left:8px">${转义(m[2])}</span>`
      : 转义(r);
    b.appendChild(d);
  }
}

</script>
</body>
</html>
