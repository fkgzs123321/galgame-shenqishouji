<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定位</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
</head>
<body style="--hue:165">
<div class="dsh-card">
  <div class="dsh-hd">
    <div class="dsh-hd-ico">📍</div>
    <div class="dsh-hd-t" id="t">定位</div>
    <div class="dsh-hd-sub" id="n">—</div>
  </div>
  <div class="dsh-bd p0" id="l"></div>
</div>
<script>

const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';

// ★★★ 属性解析 —— 只用字符串操作
//   ★ 为什么：Python→文件→浏览器 三层转义会把正则里的 \s 弄坏
//   ★★ 用 indexOf/slice 之后没有任何转义问题
const 拆属性 = (串) => {
  const 出 = {};
  let i = 0;
  while (i < 串.length) {
    const 等 = 串.indexOf('=', i);
    if (等 < 0) break;
    const 键 = 串.slice(i, 等).trim().split(' ').pop().replace(/["']/g, '');
    let 起 = 等 + 1;
    while (起 < 串.length && 串[起] === ' ') 起++;
    let 值 = '';
    if (串[起] === '"' || 串[起] === "'") {
      const 引 = 串[起];
      const 闭 = 串.indexOf(引, 起 + 1);
      值 = 串.slice(起 + 1, 闭 < 0 ? 串.length : 闭);
      i = (闭 < 0 ? 串.length : 闭) + 1;
    } else {
      const 空 = 串.indexOf(' ', 起);
      值 = 串.slice(起, 空 < 0 ? 串.length : 空);
      i = 空 < 0 ? 串.length : 空 + 1;
    }
    if (键) 出[键] = 值;
  }
  return 出;
};

const 属性 = (名) => {
  const i = 原文.indexOf('<' + 名);
  if (i < 0) return '';
  const j = 原文.indexOf('>', i);
  if (j < 0) return '';
  return 原文.slice(i + 名.length + 1, j).trim();
};

// ★ 取属性的【值】，不是整串
const 取值 = (名, key) => {
  const 串 = 属性(名);
  if (!串) return '';
  if (key) return 拆属性(串)[key] || '';
  const 全 = 拆属性(串);
  const 键 = Object.keys(全);
  return 键.length ? 全[键[0]] : 串;
};

// ★ 取标签内的正文
const 取文 = (名) => {
  // ★★★ 我是这一楼里第几个标签？—— 用酒馆助手给的序号，不再靠猜
  //   ★ 为什么不能数 f.src：酒馆助手 use_blob_url 默认 false，
  //     每个 iframe 的 src 都是 about:srcdoc → 分不清谁是谁 → 同一楼里混排会错位
  //   ★ 序号来源：iframe.id = "TH-message--<楼层>--<代码块序号>"（酒馆助手源码定的）
  let 块序 = -1;
  try {
    const fe0 = window.frameElement;
    const id = (fe0 && fe0.id) || window.__TH_IFRAME_ID || window.name || '';
    const mt = /TH-message--\d+--(\d+)/.exec(id);
    if (mt) 块序 = Number(mt[1]);
  } catch (e) {}
  if (块序 < 0) {
    // ★ 兜底：数我在本楼层全部 iframe 里的位置，就是代码块序号
    try {
      const fe1 = window.frameElement;
      const box = fe1 && (fe1.closest ? fe1.closest('.mes_text') : fe1.parentElement);
      if (box) 块序 = Array.prototype.indexOf.call(box.querySelectorAll('iframe'), fe1);
    } catch (e) {}
  }
  const 全部 = Array.from(原文.matchAll(/<([A-Za-z\u4e00-\u9fa5_]+)(?:\s[^>]*)?>([\s\S]*?)<\/\1>/g));
  // ★ 校验：序号指向的那一块，标签名就是我
  //   ★★ 对不上就退化成「同标签取第一个」—— 只退化成旧行为，绝不显示别人的内容
  if (块序 >= 0 && 全部[块序] && 全部[块序][1] === 名) return 全部[块序][2].trim();
  const 同 = 全部.filter(function (x) { return x[1] === 名; });
  return 同.length ? 同[0][2].trim() : '';
};
;
;
;

const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('t').textContent = 取值('地图') || '定位';

// ★ 格式：地点名 · 距离 ｜ 备注
const raw = 取文('地图');
const l = document.getElementById('l');
const 行s = raw.split('\n').map((x) => x.trim()).filter(Boolean);
for (const s of 行s) {
  if (/^[—\-]{3,}$/.test(s)) { const hr = document.createElement('hr'); hr.className = 'dsh-hr'; l.appendChild(hr); continue; }
  const m = s.match(/([\d.]+)\s*(km|公里|m|米)/i);
  const 距 = m ? m[1] + ' ' + m[2] : '';
  const 名 = m ? s.replace(m[0], '').replace(/[·｜|:：]\s*$/,'').trim() : s;
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;gap:10px;align-items:center;padding:8px 15px;border-bottom:1px solid var(--line)';
  d.innerHTML = `
    <span style="flex:0 0 auto;color:hsl(165,65%,55%)">📍</span>
    <span style="flex:1;color:var(--t-2);font-size:12.5px">${转义(名)}</span>
    ${距 ? `<span class="dsh-mono" style="color:hsl(165,65%,60%)">${转义(距)}</span>` : ''}`;
  l.appendChild(d);
}
if (!行s.length && raw) l.innerHTML = `<div style="padding:14px;color:var(--t-3);white-space:pre-wrap">${转义(raw)}</div>`;
document.getElementById('n').textContent = 行s.length ? 行s.length + ' 处' : '';

</script>
</body>
</html>
