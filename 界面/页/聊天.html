<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
<style>
  .chat-card {
    max-width: 440px;
    margin: 12px auto;
    background: #0c0b12;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .chat-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #ec4899);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .chat-info {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .chat-name {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
  }
  .chat-status {
    font-size: 10.5px;
    color: #10b981;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .chat-status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px #10b981;
  }
  .chat-body {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble-row {
    display: flex;
    width: 100%;
  }
  .bubble-row.left {
    justify-content: flex-start;
  }
  .bubble-row.right {
    justify-content: flex-end;
  }
  .bubble {
    max-width: 82%;
    padding: 9px 13px;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
  }
  .bubble.left {
    background: #1a1824;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px 16px 16px 4px;
    color: #e2e0eb;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .bubble.right {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    border-radius: 16px 16px 4px 16px;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
  }
  .sys-note {
    text-align: center;
    font-size: 11px;
    color: #645e75;
    margin: 4px 0;
  }
</style>
</head>
<body>
<div class="chat-card">
  <div class="chat-header">
    <div class="chat-avatar" id="av">💬</div>
    <div class="chat-info">
      <span class="chat-name" id="t">私聊</span>
      <span class="chat-status"><span class="chat-status-dot"></span>加密专线 · 在线</span>
    </div>
  </div>
  <div class="chat-body" id="c"></div>
</div>
<script>
const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  let myIndex = 0;
  try {
    const fe = window.frameElement;
    if (fe) {
      const parent = fe.closest ? fe.closest('.mes_text') : fe.parentElement;
      if (parent) {
        const iframes = Array.from(parent.querySelectorAll('iframe'));
        const same = iframes.filter(f => f === fe || f.src === fe.src);
        const found = same.indexOf(fe);
        if (found >= 0) myIndex = found;
      }
    }
  } catch (e) {}
  const allMatches = Array.from(原文.matchAll(new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>', 'g')));
  const m = allMatches[myIndex] || allMatches[0];
  return m ? m[1].trim() : '';
};

const 属性 = (名) => {
  const i = 原文.indexOf('<' + 名);
  if (i < 0) return '';
  const j = 原文.indexOf('>', i);
  if (j < 0) return '';
  return 原文.slice(i + 名.length + 1, j).trim();
};

const title = 属性('聊天');
if (title) {
  document.getElementById('t').textContent = title.replace(/^对方[=:]\s*/, '').replace(/["']/g, '');
  document.getElementById('av').textContent = title.trim().charAt(0) || '💬';
}

const raw = 取('聊天');
const c = document.getElementById('c');

for (const 一 of raw.split('\n')) {
  const s = 一.trim();
  if (!s) continue;
  const 左 = s.startsWith('｜左') || s.startsWith('|左');
  const 右 = s.startsWith('｜右') || s.startsWith('|右');
  const 文 = s.replace(/^[｜|][左右]\s*/, '');
  
  const row = document.createElement('div');
  if (左 || 右) {
    row.className = 'bubble-row ' + (左 ? 'left' : 'right');
    const b = document.createElement('div');
    b.className = 'bubble ' + (左 ? 'left' : 'right');
    b.textContent = 文;
    row.appendChild(b);
  } else {
    row.className = 'sys-note';
    row.textContent = s;
  }
  c.appendChild(row);
}
</script>
</body>
</html>
