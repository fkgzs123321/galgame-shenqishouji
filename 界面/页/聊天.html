<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
<style>
  .chat-card {
    max-width: 440px;
    margin: 12px auto;
    background: #0c0b12;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .chat-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #ec4899);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .chat-info {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .chat-name {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
  }
  .chat-status {
    font-size: 10.5px;
    color: #10b981;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .chat-status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px #10b981;
  }
  .chat-body {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble-row {
    display: flex;
    width: 100%;
  }
  .bubble-row.left {
    justify-content: flex-start;
  }
  .bubble-row.right {
    justify-content: flex-end;
  }
  .bubble {
    max-width: 82%;
    padding: 9px 13px;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
  }
  .bubble.left {
    background: #1a1824;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px 16px 16px 4px;
    color: #e2e0eb;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .bubble.right {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    border-radius: 16px 16px 4px 16px;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
  }
  .sys-note {
    text-align: center;
    font-size: 11px;
    color: #645e75;
    margin: 4px 0;
  }
</style>
</head>
<body>
<div class="chat-card">
  <div class="chat-header">
    <div class="chat-avatar" id="av">💬</div>
    <div class="chat-info">
      <span class="chat-name" id="t">私聊</span>
      <span class="chat-status"><span class="chat-status-dot"></span>加密专线 · 在线</span>
    </div>
  </div>
  <div class="chat-body" id="c"></div>
</div>
<script>
const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  // ★★★ 我是这一楼里第几个标签？—— 用酒馆助手给的序号，不再靠猜
  //   ★ 为什么不能数 f.src：酒馆助手 use_blob_url 默认 false，
  //     每个 iframe 的 src 都是 about:srcdoc → 分不清谁是谁 → 同一楼里混排会错位
  //   ★ 序号来源：iframe.id = "TH-message--<楼层>--<代码块序号>"（酒馆助手源码定的）
  let 块序 = -1;
  try {
    const fe0 = window.frameElement;
    const id = (fe0 && fe0.id) || window.__TH_IFRAME_ID || window.name || '';
    const mt = /TH-message--\d+--(\d+)/.exec(id);
    if (mt) 块序 = Number(mt[1]);
  } catch (e) {}
  if (块序 < 0) {
    // ★ 兜底：数我在本楼层全部 iframe 里的位置，就是代码块序号
    try {
      const fe1 = window.frameElement;
      const box = fe1 && (fe1.closest ? fe1.closest('.mes_text') : fe1.parentElement);
      if (box) 块序 = Array.prototype.indexOf.call(box.querySelectorAll('iframe'), fe1);
    } catch (e) {}
  }
  const 全部 = Array.from(原文.matchAll(/<([A-Za-z\u4e00-\u9fa5_]+)(?:\s[^>]*)?>([\s\S]*?)<\/\1>/g));
  // ★ 校验：序号指向的那一块，标签名就是我
  //   ★★ 对不上就退化成「同标签取第一个」—— 只退化成旧行为，绝不显示别人的内容
  if (块序 >= 0 && 全部[块序] && 全部[块序][1] === 名) return 全部[块序][2].trim();
  const 同 = 全部.filter(function (x) { return x[1] === 名; });
  return 同.length ? 同[0][2].trim() : '';
};
;

const 属性 = (名) => {
  const i = 原文.indexOf('<' + 名);
  if (i < 0) return '';
  const j = 原文.indexOf('>', i);
  if (j < 0) return '';
  return 原文.slice(i + 名.length + 1, j).trim();
};

const title = 属性('聊天');
if (title) {
  document.getElementById('t').textContent = title.replace(/^对方[=:]\s*/, '').replace(/["']/g, '');
  document.getElementById('av').textContent = title.trim().charAt(0) || '💬';
}

const raw = 取('聊天');
const c = document.getElementById('c');

for (const 一 of raw.split('\n')) {
  const s = 一.trim();
  if (!s) continue;
  const 左 = s.startsWith('｜左') || s.startsWith('|左');
  const 右 = s.startsWith('｜右') || s.startsWith('|右');
  const 文 = s.replace(/^[｜|][左右]\s*/, '');
  
  const row = document.createElement('div');
  if (左 || 右) {
    row.className = 'bubble-row ' + (左 ? 'left' : 'right');
    const b = document.createElement('div');
    b.className = 'bubble ' + (左 ? 'left' : 'right');
    b.textContent = 文;
    row.appendChild(b);
  } else {
    row.className = 'sys-note';
    row.textContent = s;
  }
  c.appendChild(row);
}
</script>
</body>
</html>
