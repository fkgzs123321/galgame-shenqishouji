<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>结算</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/gh/fkgzs123321/galgame-shenqishouji@main/界面/_共用/base.css">
</head>
<body style="--hue:285">
<div class="dsh-card" style="--hue:285">
  <div class="dsh-hd">
    <div class="dsh-hd-ico">◆</div>
    <div class="dsh-hd-t">结算</div>
    <div class="dsh-hd-sub">SETTLEMENT</div>
  </div>
  <div class="dsh-bd" id="b"></div>
</div>
<script>

const M = getChatMessages(getCurrentMessageId())[0];
const 原文 = M ? (M.message || '') : '';
const 取 = (名) => {
  const re = new RegExp('<' + 名 + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + 名 + '>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
const 属性 = (名) => {
  const re = new RegExp('<' + 名 + '\\s+([^>]*)>');
  const m = 原文.match(re);
  return m ? m[1].trim() : '';
};
// ★★★ 取属性的【值】—— 不是整串
//   ★ 踩过：原来 属性('聊天') 返回 `平台="微信"`，标题就显示这个
//   ★★ 现在 取值('聊天') 返回 `微信`
const 取值 = (名, key) => {
  const 串 = 属性(名);
  if (!串) return '';
  if (key) {
    const m = 串.match(new RegExp(key + '\\s*=\\s*"([^"]*)"'));
    if (m) return m[1];
    const m2 = 串.match(new RegExp(key + '\\s*=\\s*([^\\s]+)'));
    return m2 ? m2[1] : '';
  }
  // ★ 没指定 key → 取第一个属性的值
  const m = 串.match(/(?:^|\\s)[\\w\u4e00-\u9fa5]+\\s*=\\s*"([^"]*)"/);
  if (m) return m[1];
  const m2 = 串.match(/(?:^|\\s)[\\w\u4e00-\u9fa5]+\\s*=\\s*([^\\s]+)/);
  return m2 ? m2[1] : 串;
};
const 转义 = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const raw = 取('结算');
const b = document.getElementById('b');
const 行 = raw.split('\n').map(x => x.trim()).filter(Boolean);
for (const 一 of 行) {
  const 升 = /等级|经验|阅历|关系|解锁/.test(一);
  const 掉 = /掉|锁回|失败|连败|−|-/.test(一) && !升;
  const d = document.createElement('div');
  d.className = 升 ? 'dsh-key' : 'dsh-key';
  if (升) d.style.borderLeftColor = 'var(--c-exp)';
  if (/高潮|内射|到了|喷/.test(一)) d.style.borderLeftColor = 'var(--c-hot)';
  d.innerHTML = 转义(一)
    .replace(/(\d+)\s*→\s*(\d+)/g, '<span class="dsh-num exp">$1 → $2</span>')
    .replace(/\+(\d+)/g, '<span class="dsh-num up">+$1</span>')
    .replace(/−(\d+)/g, '<span class="dsh-num down">−$1</span>');
  b.appendChild(d);
}

</script>
</body>
</html>
